name: package

on:
  push:
  release:
    types: [published]


jobs:
    build-package:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - name: Set up Python 3.11
          uses: actions/setup-python@v7
          with:
              python-version: "3.11"
        - name: Build pip package
          run: |
              pip install -U pip build
              python3 -m build --sdist --wheel --outdir dist/ .
        - name: Archive Pypi artifacts
          uses: actions/upload-artifact@v7
          with:
              name: pypi_dist
              path: dist

    publish-package:
      if: startsWith(github.ref, 'refs/tags')
      needs: build-package
      runs-on: ubuntu-latest
      # id-token: write is for PyPI Trusted Publishing.
      permissions:
        contents: read
        id-token: write
      steps:
        - name: Download Pypi artifacts
          uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
          with:
              name: pypi_dist
              path: dist
        - name: Publish package
          uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
          with:
            # A release fires both push and release events on the tag, so the second upload is a no-op.
            skip-existing: true
