name: CI Build

on: [push]

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with python_requires and the classifiers in setup.py
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    name: test (Python ${{ matrix.python-version }})

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip --version
        python -m pip install --upgrade pip wheel
        python -m pip install numpy
        python -m pip install -v -U .
        python -m pip install -v -U -r requirements-test.txt
    - name: Test with pytest
      run: |
        pytest tests
  lint:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up Python 3.11
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.11"
    - name: Install pre-commit
      run: |
          python -m pip install --upgrade pip
          pip install pre-commit
    - name: Run pre-commit
      run: pre-commit run --all-files
